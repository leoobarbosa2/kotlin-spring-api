spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/YOURDB
    username: USERNAME
    password: PASSWORD
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true